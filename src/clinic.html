<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
</style></head><body>
<title>NLG OraDesk</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen app on white. Sidebar on wide screens, tab bar on phones; the main pane scrolls; forms rise as sheets. Single light look by design. */
:root{
  --bg:#F7F7F8; --surface:#FFFFFF; --card:#FFFFFF; --surface2:#E6EFEF; --tint:#DDF1F1; --ink:#003339; --blue:#39A8AD; --amber:#D98A00; --fg:#003339; --fg2:#3B5154;
  --line:#DCE6E6; --line2:#BFE7E8; --accent:#00666B; --accent-fill:#00666B; --accent-fg:#FFFFFF;
  --chrome:rgba(255,255,255,.82); --scrim:rgba(0,51,57,.34); --shadow:0 18px 50px rgba(0,51,57,.18);
  --critical:#B42318; --ok:#18794E; --go:#18794E; --warn:#9A5B00;
  --c-caries:#D92D2D; --c-filled:#1F6FD6; --c-rct:#7A45C9; --c-crown:#B97A00; --c-missing:#8A9491;
  --c-implant:#0E8A86; --c-fracture:#D2600A; --c-mobile:#C2327F;
  --head:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:18px; --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 .9375rem/1.45 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;height:100%}
.side{width:236px;flex:none;display:flex;flex-direction:column;gap:4px;margin:12px 0 12px max(12px,env(safe-area-inset-left,0px));padding:18px 12px;border-radius:24px;background:var(--card);overflow-y:auto}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 6px 16px;text-align:center}
.prof .logo{width:76px;height:76px;border-radius:50%;background:var(--bg);display:grid;place-items:center;overflow:hidden;font-weight:700;font-size:1.25rem;color:var(--accent)}
.prof .logo img{width:100%;height:100%;object-fit:contain;padding:10px}
.prof b{font-size:1rem;overflow-wrap:anywhere}
.prof span{font-size:.8125rem;color:var(--fg2);overflow-wrap:anywhere}
.sidecard{margin-top:auto;padding:16px;border-radius:20px;background:var(--ink);color:#FFFFFF;display:flex;flex-direction:column;gap:10px;text-align:center}
.sidecard span{font-size:.8125rem;color:#C9D8F0}
.sidecard .btn{background:#FFFFFF;color:var(--ink)}
.brand{display:flex;flex-direction:column;gap:8px;padding:4px 10px 18px;font-size:1.0625rem;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.brand img{max-height:52px;max-width:100%;object-fit:contain;align-self:flex-start}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-weight:500;color:var(--fg);transition:transform .1s ease-out,background .15s}
.nav svg{width:20px;height:20px;flex:none;color:var(--fg2)}
.nav:active{transform:scale(.97)}
.nav[aria-current="page"]{background:var(--tint);color:var(--accent)}
.nav[aria-current="page"] svg{color:var(--accent)}
.main{flex:1;min-width:0;overflow-y:auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:clamp(0px,2vw,20px);display:flex;flex-direction:column;gap:20px}

.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.vhead>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.8125rem;font-weight:600;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
h1{font-size:2.125rem;line-height:1.1;font-weight:700;letter-spacing:-.022em;text-wrap:balance}
h2{font-size:1.0625rem;font-weight:600}
h3{font-size:1.0625rem;font-weight:600}
.sub{color:var(--fg2)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;min-height:36px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;font-weight:500;background:var(--surface2);transition:transform .1s ease-out,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent-fill);color:var(--accent-fg)}
.btn.go,.bt .btn.go,.bt.next .btn.go{background:var(--go)!important;color:#FFFFFF!important;border-color:transparent!important}
.nv{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding:16px}
.nvic{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--accent)}
.nvic svg{width:20px;height:20px}
.nvmain{flex:1;min-width:200px;display:flex;flex-direction:column;gap:3px}
.nvmain b{font-size:1.0625rem}
.nvmain span{color:var(--fg2)}
.btn.plain{background:none;color:var(--accent);padding:0 6px}
.btn.strong{font-weight:600}
.btn.danger{color:var(--critical)}
.btn.icon{width:36px;padding:0;font-size:1.125rem}
.btn.sm{min-height:30px;padding:0 11px;font-size:.8125rem}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:2px;gap:2px}
.seg button{padding:6px 14px;border-radius:8px;font-weight:500;font-size:.875rem;transition:background .15s}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,51,57,.14);color:var(--accent)}

.banner{padding:10px 14px;border-radius:12px;background:var(--surface2);color:var(--fg2);font-size:.875rem}
.card{background:var(--card);border-radius:22px}
.pill{display:inline-flex;align-items:center;min-height:22px;padding:1px 9px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--surface2);color:var(--fg2);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.acc{color:var(--accent);background:var(--tint)} .pill.crit{color:var(--critical)} .pill.warn{color:var(--warn)}
button.pill{min-height:30px;padding:1px 12px}

/* Schedule */
.sched-scroll{overflow-x:auto;border-radius:var(--r)}
.sched-grid{display:grid;grid-template-columns:56px repeat(var(--n),minmax(var(--cw,132px),1fr));min-width:0}
.chead{padding:12px 10px;font-weight:600;font-size:.875rem;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.corner{border-bottom:1px solid var(--line)}
.tl{height:var(--hh);padding:4px 8px 0 0;text-align:right;font-size:.75rem;color:var(--fg2);font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px solid var(--line);cursor:pointer;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px),var(--line) var(--hh))}
.appt{position:absolute;left:4px;right:4px;display:flex;flex-direction:column;gap:1px;padding:5px 8px;border-radius:9px;overflow:hidden;font-size:.8125rem;line-height:1.25;background:var(--tint);color:var(--fg);user-select:none;-webkit-user-select:none;transition:box-shadow .15s}
.appt b,.appt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt span{color:var(--fg2)}
.appt.st-arrived{background:color-mix(in srgb,var(--ok) 22%,var(--surface))}
.appt.st-engaged{background:color-mix(in srgb,var(--blue) 18%,var(--surface))}
.appt.st-done{background:var(--surface2)}
.appt.st-noshow{background:color-mix(in srgb,var(--critical) 12%,var(--surface))}
.appt.dragging{z-index:5;box-shadow:var(--shadow);opacity:.92;cursor:grabbing}
.now{position:absolute;left:0;right:0;height:2px;background:var(--critical);pointer-events:none;z-index:2}

/* Lists */
.search{width:100%;min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface)}
.rows>li+li{border-top:1px solid var(--line)}
.rows>li{display:flex;align-items:center}
.row{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:12px 16px;min-height:60px;border-radius:var(--r)}
.row:active{background:var(--surface2)}
.ck{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;color:var(--accent-fg);font-size:.8125rem;font-weight:700}
.row[aria-pressed="true"] .ck{background:var(--accent-fill);border-color:var(--accent-fill)}
.row[aria-pressed="true"]{background:var(--tint)}
.demobar,.askbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--tint);margin-bottom:12px}
.askbar{background:#FDECEC}
.demobar span,.askbar span{flex:1;min-width:180px}
.rside{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;padding-right:14px}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--tint);font-weight:600;font-size:.8125rem;color:var(--accent)}
.tm{flex:none;width:72px;font-weight:600;font-variant-numeric:tabular-nums}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column}
.rmain b{font-weight:600;overflow-wrap:anywhere}
.rmain span{color:var(--fg2);font-size:.8125rem;overflow-wrap:anywhere}
.rend{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.empty{padding:28px 20px;text-align:center;color:var(--fg2);display:flex;flex-direction:column;align-items:center;gap:12px}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:var(--surface2);font-weight:600}
.gline{display:flex;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}

/* Record and chart */
.alert{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--critical) 9%,var(--surface));font-weight:500}
.alert b{color:var(--critical)}
.pad{padding:20px;display:flex;flex-direction:column;gap:18px}
.facebox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 14px;border-radius:14px;background:var(--bg)}
.face{width:100%;max-width:330px;height:auto}
.face .deco{fill:none;stroke:#93A9AB;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.face .skin{fill:#FFFFFF;stroke:#93A9AB;stroke-width:1.6}
.fz{cursor:pointer}
.fz>*{fill:var(--zc,#00666B);fill-opacity:var(--zo,.06);stroke:var(--zc,#00666B);stroke-opacity:.55;stroke-width:1.4;stroke-dasharray:4 3;transition:fill-opacity .12s}
.fz:hover>*{fill-opacity:.22}
.fz.on>*{fill-opacity:.42;stroke-dasharray:none}
.fz.sel>*{stroke:#051B1D;stroke-opacity:1;stroke-width:2.6;stroke-dasharray:none}
.zchips{justify-content:center}
.chartbox{display:flex;flex-direction:column;gap:6px;padding:18px 14px;border-radius:14px;background:var(--bg)}
.capt{display:flex;justify-content:space-between;font-size:.75rem;font-weight:600;color:var(--fg2);letter-spacing:.03em;text-transform:uppercase}
.capt .narrow{display:none;text-transform:none;letter-spacing:0;font-weight:400}
.archlabel{text-align:center;font-size:.6875rem;font-weight:600;color:var(--fg2);letter-spacing:.08em;text-transform:uppercase}
.arch{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:2px}
.tooth{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;border-radius:10px;transition:transform .1s ease-out,background .15s}
.arch.lower .tooth{flex-direction:column-reverse}
.tooth:active{transform:scale(.94)}
.tooth:hover{background:var(--card)}
.tsvg{width:100%;max-width:44px;height:auto;display:block}
.ssvg{width:72%;max-width:26px;height:auto;display:block}
.tn{font-size:.75rem;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1.1}
.tc{font-size:.625rem;font-weight:700;line-height:1;min-height:.625rem;color:var(--c,var(--fg2))}
.tooth.sel{background:var(--surface);box-shadow:0 0 0 2px var(--accent-fill)}
.tooth.sel .tn{color:var(--accent)}
.tooth .dot{position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:var(--accent-fill);border:1.5px solid var(--bg)}
.tooth.mid{margin-left:0}
.tooth.mid::before{content:"";position:absolute;left:-2px;top:4px;bottom:4px;width:1.5px;background:var(--line2)}
.insp{display:flex;flex-direction:column;gap:12px}
.label{font-size:.8125rem;font-weight:600;color:var(--fg2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:999px;background:var(--surface2);font-size:.875rem;font-weight:500;transition:transform .1s ease-out}
button.chip:active{transform:scale(.96)}
.chip i{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.chip[aria-pressed="true"]{background:var(--accent-fill);color:var(--accent-fg)}
.chip[aria-pressed="true"] i{box-shadow:0 0 0 1.5px var(--accent-fg)}
.thead{display:flex;align-items:center;gap:12px}
.tnum{display:grid;place-items:center;min-width:48px;height:48px;padding:0 8px;border-radius:14px;background:var(--accent-fill);color:var(--accent-fg);font-size:1.25rem;font-weight:700;flex:none}
.thead .sub{display:flex;align-items:center;gap:6px;margin-top:2px}
.thead .sub i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.lrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.lrow .cnt{font-size:.8125rem;font-weight:600;color:var(--accent)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
.opt{position:relative;display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:.875rem;font-weight:600;color:var(--fg);text-align:left;line-height:1.2;transition:transform .1s ease-out,border-color .15s,background-color .15s}
.opt:hover{border-color:var(--line2)}
button.opt:active{transform:scale(.97)}
.opt i{width:12px;height:12px;border-radius:4px;background:var(--c,#fff);box-shadow:inset 0 0 0 1.5px var(--line2);flex:none}
.opt[style*="--c"] i{box-shadow:none}
.opt[aria-pressed="true"]{padding-right:34px;border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 11%,var(--surface))}
.opt[aria-pressed="true"]::after{content:"✓";position:absolute;right:10px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--c,var(--accent));color:#fff;font-size:11px;font-weight:700}
.opt.add .pl{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--surface2);color:var(--accent);font-size:15px;font-weight:700;line-height:1;flex:none}
.opt.add[aria-pressed="true"]{--c:var(--accent)}
.opt.add[aria-pressed="true"] .pl{display:none}
.opt.add .pl+*{min-width:0}
.opt.more{border-style:dashed;color:var(--fg2);font-weight:500}
@media(max-width:760px){.ogrid{grid-template-columns:repeat(2,minmax(0,1fr))}.opt{min-height:50px;font-size:.9375rem;gap:9px;padding:8px 10px}.opt[aria-pressed="true"]{padding-right:32px}}
.prow{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;flex:1;min-width:0}
.tb{flex:none;min-width:38px;height:28px;padding:0 6px;display:grid;place-items:center;border-radius:8px;background:var(--tint);color:var(--accent);font-weight:700;font-size:.8125rem;font-variant-numeric:tabular-nums}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.pmain .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.stage{min-height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);font-size:.8125rem;transition:transform .1s ease-out}
.stage:active{transform:scale(.96)}
.stage.on{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:var(--ok);color:var(--ok);font-weight:600}
.logobox{display:grid;place-items:center;width:160px;max-width:100%;height:84px;border:1px dashed var(--line2);border-radius:12px;color:var(--fg2);font-size:.8125rem;padding:8px}
.logobox img{max-width:100%;max-height:100%;object-fit:contain}

/* Forms and sheet */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.8125rem;font-weight:600;color:var(--fg2)}
.field input,.field select,.field textarea{min-height:40px;padding:8px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
.lineitem{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px}
.err{color:var(--critical);font-weight:500;padding:0 20px 16px}
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s ease;z-index:30}
.scrim.open{opacity:1}
.sheet{position:fixed;z-index:31;left:50%;top:50%;width:min(500px,calc(100% - 32px));max-height:86%;overflow-y:auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);opacity:0;transform:translate(-50%,-47%) scale(.97);transition:transform .42s var(--ease),opacity .25s ease}
.sheet.open{opacity:1;transform:translate(-50%,-50%) scale(1)}
.sheet header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--chrome);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line);z-index:1}
.sheet header h2{flex:1;text-align:center}
.sbody{display:flex;flex-direction:column;gap:14px;padding:18px 20px 20px}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:500;box-shadow:var(--shadow);transition:transform .35s var(--ease),opacity .2s;pointer-events:none}
.toast.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:inherit;font-weight:700;text-decoration:underline;flex:none}
#toastMsg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* Dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:center}
.hero h1{font-size:clamp(1.9rem,3.4vw,2.75rem);line-height:1.08}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero>div:first-child{display:flex;flex-direction:column;gap:10px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:16px;border-radius:22px;background:var(--card);min-height:132px;font-weight:600;line-height:1.25;transition:transform .1s ease-out}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--accent)}
.tile .ic svg{width:20px;height:20px}
.tile.dark{background:var(--ink);color:#FFFFFF}
.tile.dark .ic{background:var(--accent-fill);color:#FFFFFF}
.dash{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ringc{display:flex;align-items:center;gap:12px;padding:16px;border-radius:22px;background:var(--card);min-width:0}
.ringc svg{width:54px;height:54px;flex:none}
.ringc div{min-width:0;display:flex;flex-direction:column}
.ringc small{font-size:.6875rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.ringc b{font-size:1rem}
.ringc span{font-size:.8125rem;color:var(--fg2)}
.dcard{padding:18px;border-radius:24px;background:var(--card);display:flex;flex-direction:column;gap:14px;min-width:0}

function shift(s,n){const d=toDate(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function daysTo(s){return Math.round((toDate(s)-toDate(today()))/864e5);}
function fmtTime(m){const h=Math.floor(m/60),mm=m%60;return (h%12||12)+':'+pad(mm)+' '+(h<12?'AM':'PM');}
function fmtHour(h){return (h%12||12)+' '+(h<12?'AM':'PM');}
function fmtDate(s,o){return toDate(s).toLocaleDateString('en-IN',o||{day:'numeric',month:'long',year:'numeric'});}
const fmtShort=s=>fmtDate(s,{day:'numeric',month:'short'});
function toothType(n){const q=Math.floor(n/10),p=n%10;if(q<=4)return p>=6?'m':p>=4?'pm':p===3?'c':'i';return p>=4?'m':p===3?'c':'i';}
function toothName(n){n=+n;const q=Math.floor(n/10),p=n%10,perm=q<=4;
  const quad={1:'Upper right',2:'Upper left',3:'Lower left',4:'Lower right',5:'Upper right',6:'Upper left',7:'Lower left',8:'Lower right'}[q];
  const names=perm?['central incisor','lateral incisor','canine','first premolar','second premolar','first molar','second molar','third molar']:['central incisor','lateral incisor','canine','first molar','second molar'];
  if(!quad||!names[p-1])return '';return quad+' '+(perm?'':'primary ')+names[p-1];}
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function tstate(p,n){const v=p.chart&&p.chart[n];if(!v)return {c:'',s:[]};if(typeof v==='string')return {c:v,s:[]};return {c:v.c||'',s:Array.isArray(v.s)?v.s:[]};}
function dueInfo(s){const d=daysTo(s);if(d<0)return ['Overdue '+(-d)+' d','crit'];if(d===0)return ['Due today','warn'];return ['Due '+fmtShort(s),''];}

function freeSlot(date,chair,start,dur){let c=chair,m=start;
  for(let k=0;k<200;k++){if(m+dur>settings.dayEnd*60){m=settings.dayStart*60;c=(c+1)%settings.chairs.length;}
    if(!conflict(date,c,m,dur))return [c,m];m+=15;}
  return [chair,start];}

function deletePatients(ids,label){
  const ps=[],ap=[],lb=[];
  ids.forEach(id=>{const p=patient(id);if(p)ps.push([id,p]);});
  for(const [aid,a] of data.appointments)if(ids.includes(a.patientId)||(label==='demo'&&a.example))ap.push([aid,a]);
  for(const [lid,l] of data.lab)if(ids.includes(l.patientId)||(label==='demo'&&l.example))lb.push([lid,l]);
  if(ids.includes(S.patientId))S.patientId=null;
  ap.forEach(([k])=>del('appointments',k));lb.forEach(([k])=>del('lab',k));ps.forEach(([k])=>del('patients',k));
  toast((label==='demo'?'Demo data deleted: ':'Deleted ')+ps.length+(ps.length===1?' patient':' patients'),()=>{
    ps.forEach(([k,v])=>put('patients',k,v));ap.forEach(([k,v])=>put('appointments',k,v));lb.forEach(([k,v])=>put('lab',k,v));});
}
function nextVisit(id){const t=today(),now=new Date(),mins=now.getHours()*60+now.getMinutes();
  return [...data.appointments].filter(([,a])=>a.patientId===id&&a.status!=='noshow'&&a.status!=='done'&&(a.date>t||(a.date===t&&a.start>mins)))
    .sort((x,y)=>(x[1].date+String(x[1].start).padStart(4,'0')).localeCompare(y[1].date+String(y[1].start).padStart(4,'0')))[0]||null;}
function isDone(it){return it.done>=Math.max(1,it.stages.length);}
function pending(p){return (p.plan||[]).filter(i=>!isDone(i)).length;}
function conflict(date,chair,start,dur,skip){
  for(const [id,a] of data.appointments){if(id===skip||a.date!==date||a.chair!==chair||a.status==='noshow')continue;
    if(start<a.start+a.dur&&a.start<start+dur)return a;}
  return null;}

async function init(){
  render();
  let d=null;const use=async n=>{try{return window.odhost&&window.odhost.use?await window.odhost.use(n):null;}catch(e){return null;}};
  use('downloads').then(x=>{dl=x;S.canDl=!!x&&!!window.jspdf;render();});
  d=await use('db');
  if(!d){S.status='local';render();return;}
  db=d;let got=0;const seen={};
  const slow=setTimeout(()=>{if(S.status==='loading'){S.status='slow';render();}},10000);
  const ok=k=>{if(!seen[k]){seen[k]=1;got++;}if(got>=3){clearTimeout(slow);S.status='ready';}};
  const fail=()=>{clearTimeout(slow);S.status='slow';render();};
  const sub=(c,k)=>db.collection(c).onSnapshot(s=>{data[c]=new Map(s.docs.map(x=>[x.id,x.data()]));ok(k);render();},fail);
  sub('patients','p');sub('appointments','a');sub('lab','l');
  db.doc('settings/main').onSnapshot(s=>{if(s.exists){const v=s.data();settings={aes:v.aes!==false,chairs:Array.isArray(v.chairs)&&v.chairs.length?v.chairs.slice():['Chair 1'],dayStart:+v.dayStart||9,dayEnd:+v.dayEnd||20,clinic:Object.assign({},v.clinic||{}),fin:v.fin!==false,clinicians:Array.isArray(v.clinicians)?v.clinicians.slice():[],prices:Object.assign({},v.prices||{})};render();}},()=>{});
  db.doc('settings/backup').onSnapshot(s=>{backupInfo={last:s.exists?String(s.data().last||''):''};render();},()=>{});
  db.doc('settings/brand').onSnapshot(s=>{const v=s.exists?s.data():{};brand={logo:v.logo||'',w:+v.w||0,h:+v.h||0};render();},()=>{});
}

async function doCsv(){

function readRestore(file){
  if(!file)return;const rd=new FileReader();
  rd.onload=()=>{let b=null;try{b=JSON.parse(rd.result);}catch(e){}
    if(!b||b.app!=='OraDesk'||b.kind!=='backup'||!b.data||typeof b.data!=='object'){toast('This file is not an OraDesk backup.');return;}
    const n=k=>b.data[k]&&typeof b.data[k]==='object'?Object.keys(b.data[k]).length:0;
    const when=b.created?new Date(b.created).toLocaleString('en-IN',{day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit'}):'an unknown date';
    openSheet('Restore backup','<p>This backup is from <b>'+esc(when)+'</b>.</p><div class="bkstat"><div><b>'+n('patients')+'</b><span>Patients</span></div><div><b>'+n('appointments')+'</b><span>Appointments</span></div><div><b>'+n('lab')+'</b><span>Lab orders</span></div></div><p class="sub">Restore adds the records in this file and replaces records with the same ID. It deletes nothing.</p>',()=>{runRestore(b);},'Restore');};
  rd.readAsText(file);
}
async function runRestore(b){
  const ok=id=>/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)&&id!=='.'&&id!=='..';
  let done=0,bad=0;toast('Restoring…');
  for(const coll of ['patients','appointments','lab']){
    const src=b.data[coll]||{};
    for(const id of Object.keys(src)){const doc=src[id];if(!ok(id)||!doc||typeof doc!=='object'||Array.isArray(doc)){bad++;continue;}
      data[coll].set(id,doc);if(db){try{await db.doc(coll+'/'+id).set(doc);}catch(e){bad++;continue;}}done++;}
  }
  const st=b.data.settings||{};
  if(st.main&&typeof st.main==='object'&&Array.isArray(st.main.chairs)){settings=Object.assign({},settings,st.main);if(db){try{await db.doc('settings/main').set(settings);}catch(e){}}}
  if(st.brand&&typeof st.brand==='object'&&typeof st.brand.logo==='string'){brand=st.brand;if(db){try{await db.doc('settings/brand').set(brand);}catch(e){}}}
  render();toast('Restored '+done+' records'+(bad?'. '+bad+' could not be restored.':'.'));
}

  for(let i=0;i<off;i++)h+='<span></span>';
  for(let d=1;d<=dim;d++){const ds=ms.slice(0,8)+pad(d),l=dayAppts(ds,null);
    h+='<button class="sa-mc'+(ds===S.date?' sel':'')+(ds===t?' tod':'')+'" data-act="pick" data-d="'+ds+'" aria-pressed="'+(ds===S.date)+'" aria-label="'+esc(fmtDate(ds,{weekday:'long',day:'numeric',month:'long'}))+', '+l.length+' appointments"><span class="sa-mt"><b>'+d+'</b>'+(l.length?'<em>'+l.length+'</em>':'')+'</span>'+l.slice(0,2).map(([,a])=>{const c=catOf(a.reason);return '<i style="--bg:'+c[2]+';--k:'+c[3]+'">'+esc(fmtTime(a.start).replace(':00','').replace(' ','')+' '+pname(a.patientId,a.patientName).split(' ')[0])+'</i>';}).join('')+(l.length>1?'<small class="m1">+'+(l.length-1)+' more</small>':'')+(l.length>2?'<small class="m2">+'+(l.length-2)+' more</small>':'')+'</button>';}
  const tail=(7-(off+dim)%7)%7;for(let i=0;i<tail;i++)h+='<span></span>';
  const ap=dayAppts(S.date,null),ffm=firstFree(S.date);
  const items=ap.map(([id,a])=>[a.start,saAppt(id,a,true)]);
  h+='</div></section><aside class="sa-mp pbox"><div class="sa-mph"><span>'+(S.date===t?'TODAY':'SELECTED DAY')+'</span><h2>'+esc(fmtDate(S.date,{weekday:'long',day:'numeric',month:'short'}))+'</h2><em>'+ap.length+(ap.length===1?' appointment':' appointments')+'</em></div><ul class="agl">'+(items.length?items.map(x=>x[1]).join(''):'<li class="agempty">No appointments.</li>')+'</ul><div class="sa-mpf">'+(ffm?'<button class="btn" data-act="book-slot" data-d="'+S.date+'" data-c="'+ffm[1]+'" data-m="'+ffm[0]+'">+ Book</button>':'')+'<button class="btn sa-open" data-act="mode" data-v="day">Open this day</button></div></aside></div>';
  return h;}
function scheduleHTML(){
  if(!['day','week','month'].includes(S.mode))S.mode='day';
  const counts=apptCounts(),t=today(),ws=weekStart(S.date),dayList=dayAppts(S.date,null);
  const lbl=S.mode==='day'?[S.date===t?'TODAY':fmtDate(S.date,{weekday:'long'}).toUpperCase(),fmtDate(S.date,{weekday:'long',day:'numeric',month:'short'})]
    :S.mode==='week'?[ws===weekStart(t)?'THIS WEEK':'WEEK',fmtShort(ws)+' – '+fmtDate(shift(ws,6),{day:'numeric',month:'short',year:'numeric'})]
    :[monthStart(S.date)===monthStart(t)?'THIS MONTH':'MONTH',fmtDate(monthStart(S.date),{month:'long',year:'numeric'})];
  let h='<div class="schedhead"><h1>Schedule</h1><div class="vpills" role="group" aria-label="View">'+[['day','Daily'],['week','Weekly'],['month','Monthly']].map(m=>'<button data-act="mode" data-v="'+m[0]+'" aria-pressed="'+(S.mode===m[0])+'">'+m[1]+'</button>').join('')+'</div><span class="grow donly"></span>'+
    '<span class="sa-nav donly"><button class="sa-arr" data-act="day" data-n="-1" aria-label="Previous">‹</button><button class="sa-lbl" data-act="day" data-n="0" aria-label="Go to today"><span>'+esc(lbl[0])+'</span><b>'+esc(lbl[1])+'</b></button><button class="sa-arr" data-act="day" data-n="1" aria-label="Next">›</button></span>'+

function patientRows(){
  const q=S.query.trim().toLowerCase();
  const list=[...data.patients].filter(([,p])=>!q||(p.name||'').toLowerCase().includes(q)||(p.phone||'').includes(q)).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
  if(!list.length){
    if(q)return '<div class="empty">No patient matches “'+esc(S.query)+'”.</div>';
    return '<div class="empty"><p>Patients you add appear here, with their chart and treatment plan.</p><div class="tools" style="justify-content:center"><button class="btn primary" data-act="patient-new">'+IC.plus+'Add the first patient</button><button class="btn" data-act="demo-load">Load 5 demo patients</button></div></div>';}
  const PER=10,pages=Math.ceil(list.length/PER);S.ppage=Math.min(Math.max(0,S.ppage||0),pages-1);
  const from=S.ppage*PER,shown=list.slice(from,from+PER);
  const pager=pages>1?'<div class="ppg"><button class="btn sm" data-act="ppage" data-n="-1"'+(S.ppage?'':' disabled')+'>‹ Previous</button><span>'+(from+1)+'–'+(from+shown.length)+' of '+list.length+'</span><button class="btn sm" data-act="ppage" data-n="1"'+(S.ppage<pages-1?'':' disabled')+'>Next ›</button></div>':'';
  return '<ul class="rows nopage">'+shown.map(([id,p])=>{const n=pending(p);
    const meta=[p.phone,p.age?p.age+' y':'',p.sex].filter(Boolean).join(' · ');
    if(S.sel){const on=S.sel.has(id);
      return '<li><button class="row" data-act="sel-toggle" data-id="'+esc(id)+'" aria-pressed="'+on+'"><span class="ck" aria-hidden="true">'+(on?'✓':'')+'</span><span class="rmain"><b>'+esc(p.name)+'</b><span>'+esc(meta||'No contact details')+'</span></span><span class="rend">'+(p.example?'<span class="pill demo">Demo</span>':'')+'</span></button></li>';}
    return '<li><button class="row" data-act="open" data-id="'+esc(id)+'"><span class="av">'+esc(initials(p.name))+'</span><span class="rmain"><b>'+esc(p.name)+'</b><span>'+esc(meta||'No contact details')+'</span></span><span class="rend">'+
      (p.example?'<span class="pill demo">Demo</span>':'')+(p.alerts?'<span class="pill crit">Alert</span>':'')+(n?'<span class="pill acc">'+n+' pending</span>':'')+'</span></button></li>';}).join('')+'</ul>'+pager;
}
function demoCount(){let n=0;for(const [,p] of data.patients)if(p.example)n++;return n;}
function patientsHTML(){
  if(S.sel)for(const id of [...S.sel])if(!data.patients.has(id))S.sel.delete(id);
  if(S.sel&&!data.patients.size){S.sel=null;S.selAsk=false;}
  const n=S.sel?S.sel.size:0,all=S.sel&&n===data.patients.size;
  const tools=S.sel
    ?'<button class="btn" data-act="sel-all">'+(all?'Clear selection':'Select all')+'</button><button class="btn danger" data-act="sel-del"'+(n?'':' disabled')+'>Delete'+(n?' ('+n+')':'')+'</button><button class="btn primary" data-act="sel-done">Done</button>'
    :(data.patients.size?'<button class="btn" data-act="sel-mode">Select</button>':'')+'<button class="btn primary donly" data-act="patient-new">'+IC.plus+'New patient</button>';
  const dn=demoCount();
  const ask=S.sel&&S.selAsk&&n?'<div class="askbar" role="alert"><span>Delete '+n+(n===1?' patient':' patients')+' with their appointments and lab orders?</span><button class="btn" data-act="sel-cancel">Cancel</button><button class="btn primary" style="background:var(--critical)" data-act="sel-confirm">Delete '+n+'</button></div>':'';
  const demo=!S.sel&&dn?'<div class="demobar"><span>'+dn+' demo '+(dn===1?'patient is':'patients are')+' shown for the trial. Delete them before real use.</span><button class="btn sm danger" data-act="demo-del">Delete all demo data</button></div>':'';
  return '<header class="vhead"><div><h1>Patients</h1><p class="sub">'+(S.sel?n+' selected':data.patients.size+(data.patients.size===1?' record':' records'))+'</p></div><div class="tools">'+tools+'</div></header>'+bannerHTML()+ask+demo+
    '<input class="search" id="search" type="search" placeholder="Search by name or phone" aria-label="Search patients" value="'+esc(S.query)+'">'+
    '<div class="card fill" id="plist">'+patientRows()+'</div>';
}

function toothSVG(n,st,lower){
  const sh=SHAPES[toothType(n)],cd=CMAP[st.c],col=cd?cd.col:'',line='#93A9AB';
  let g='';
  if(st.c==='missing'){
    g='<g opacity=".55">'+sh.roots.map(r=>'<path d="'+r+'" fill="none" stroke="'+line+'" stroke-width="1.200" stroke-dasharray="2.500 2.500"/>').join('')+'<path d="'+sh.crown+'" fill="none" stroke="'+line+'" stroke-width="1.200" stroke-dasharray="2.500 2.500"/></g><path d="M12 38L28 54M28 38L12 54" stroke="'+col+'" stroke-width="2.200" stroke-linecap="round" fill="none"/>';
  }else{
    if(st.c==='implant'){
      g+='<path d="M16.500 7Q20 3 23.500 7L23.500 34L16.500 34Z" fill="'+col+'" fill-opacity=".25" stroke="'+col+'" stroke-width="1.400"/><path d="M16.500 12L23.500 14M16.500 17L23.500 19M16.500 22L23.500 24M16.500 27L23.500 29" stroke="'+col+'" stroke-width="1.200" fill="none"/>';
    }else{
      g+=sh.roots.map(r=>'<path d="'+r+'" fill="'+(st.c==='rct'?col:'#FFFFFF')+'"'+(st.c==='rct'?' fill-opacity=".85"':'')+' stroke="'+(st.c==='rct'?col:line)+'" stroke-width="1.300" stroke-linejoin="round"/>').join('');
    }
    const strong=st.c==='crown',tint=cd&&st.c!=='rct'&&st.c!=='implant';
    g+='<path d="'+sh.crown+'" fill="'+(tint?col:'#FFFFFF')+'"'+(tint?' fill-opacity="'+(strong?'.55':'.2')+'"':'')+' stroke="'+(tint?col:line)+'" stroke-width="'+(strong?'2':'1.400')+'" stroke-linejoin="round"/>';
    if(st.c==='fracture')g+='<path d="M11 40L17 45L14 49L22 52L19 56" fill="none" stroke="'+col+'" stroke-width="1.800" stroke-linejoin="round" stroke-linecap="round"/>';
    if(st.c==='mobile')g+='<path d="M4 44L1.500 47L4 50M36 44L38.500 47L36 50" fill="none" stroke="'+col+'" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  return '<svg class="tsvg" viewBox="0 0 40 62" aria-hidden="true"'+(lower?' style="transform:scaleY(-1)"':'')+'>'+g+'</svg>';
}
function surfSVG(n,st,lower){
  const q=Math.floor(n/10),mesialRight=[1,4,5,8].includes(q),cd=CMAP[st.c],col=cd&&cd.surf?cd.col:'';
  const map={top:lower?'L':'B',bottom:lower?'B':'L',right:mesialRight?'M':'D',left:mesialRight?'D':'M',mid:'O'};
  const f=k=>col&&st.s.includes(map[k])?col:'#FFFFFF',line='#93A9AB',a=' stroke="'+line+'" stroke-width="1" stroke-linejoin="round"';
  return '<svg class="ssvg" viewBox="0 0 28 28" aria-hidden="true"'+(st.c==='missing'?' opacity=".35"':'')+'><polygon points="2,2 26,2 19,9 9,9" fill="'+f('top')+'"'+a+'/><polygon points="2,26 26,26 19,19 9,19" fill="'+f('bottom')+'"'+a+'/><polygon points="2,2 9,9 9,19 2,26" fill="'+f('left')+'"'+a+'/><polygon points="26,2 26,26 19,19 19,9" fill="'+f('right')+'"'+a+'/><rect x="9" y="9" width="10" height="10" fill="'+f('mid')+'"'+a+'/></svg>';
}

const P=s=>String(s==null?'':s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/·/g,'-').replace(/[^\n\x20-\xFF]/g,'?');

function pdfKV(o,pairs){const d=o.d;d.setFontSize(10);pairs.filter(p=>p[1]).forEach(p=>{d.setFont('helvetica','normal');d.setTextColor(92,107,104);d.text(P(p[0]),15,o.y);d.setTextColor(16,32,29);d.text(d.splitTextToSize(P(p[1]),140)[0],48,o.y);o.y+=5.6;});o.y+=3;}
function pdfHead(o,cols){const d=o.d;d.setFillColor(221,241,241);d.rect(15,o.y-4.6,180,7,'F');d.setFont('helvetica','bold');d.setFontSize(9);d.setTextColor(0,102,107);cols.forEach(c=>d.text(P(c[0]),c[1],o.y,c[2]?{align:'right'}:undefined));o.y+=7.5;}
function pdfRow(o,cols){const d=o.d;if(o.y>272){d.addPage();o.y=20;}d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(16,32,29);let lines=1;
  cols.forEach(c=>{const t=c[3]?d.splitTextToSize(P(c[0]),c[3]):[P(c[0])];lines=Math.max(lines,t.length);d.text(t,c[1],o.y,c[2]?{align:'right'}:undefined);});

function pdfSign(o){const d=o.d,c=settings.clinic||{};o.y=Math.max(o.y+18,o.y);if(o.y>265){d.addPage();o.y=40;}d.setDrawColor(150,160,158);d.setLineWidth(.2);d.line(140,o.y,195,o.y);d.setFont('helvetica','normal');d.setFontSize(9);d.setTextColor(92,107,104);d.text(P(c.doctor||'Doctor'),195,o.y+4.5,{align:'right'});}

function loadLogo(file){
  if(!file)return;const rd=new FileReader();
  rd.onload=()=>{const img=new Image();
    img.onload=()=>{const max=520,k=Math.min(1,max/Math.max(img.width||max,img.height||max)),w=Math.max(1,Math.round((img.width||max)*k)),h=Math.max(1,Math.round((img.height||max)*k));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);
      let url=cv.toDataURL('image/png');
      if(url.length>180000){cx.globalCompositeOperation='destination-over';cx.fillStyle='#FFFFFF';cx.fillRect(0,0,w,h);url=cv.toDataURL('image/jpeg',.86);}
      if(url.length>240000){toast('This logo file is too large. Use a smaller image.');return;}
      putBrand({logo:url,w:w,h:h});toast('Logo saved');};
    img.onerror=()=>toast('This file is not a usable image.');img.src=rd.result;};
  rd.readAsDataURL(file);
}

/* ---------- actions ---------- */
function act(name,t){
  switch(name){
    case 'go':S.view=t.dataset.view;S.patientId=null;S.tooth=null;try{localStorage.setItem('opd-view',S.view);}catch(e){}render();$('.main').scrollTop=0;break;
    case 'day':{const n=+t.dataset.n;S.date=!n?today():S.mode==='week'?shift(S.date,7*n):S.mode==='month'?addMonths(S.date,n):shift(S.date,n);S.calMonth=monthStart(S.date);render();break;}
    case 'mode':S.mode=t.dataset.v;render();break;
    case 'wk':S.date=shift(S.date,7*(+t.dataset.n));S.calMonth=monthStart(S.date);render();break;
    case 'calmonth':S.calMonth=addMonths(S.calMonth||monthStart(S.date),+t.dataset.n);render();break;
    case 'pick':S.date=t.dataset.d;S.calMonth=monthStart(S.date);if(t.dataset.mode)S.mode=t.dataset.mode;render();break;
    case 'check':{const id=t.dataset.id,a=data.appointments.get(id);if(a)put('appointments',id,Object.assign({},a,{status:a.status==='done'?'booked':'done'}));break;}
    case 'appt-new':apptSheet(null);break;
    case 'book-slot':apptSheet(null,{date:t.dataset.d,chair:+t.dataset.c,start:+t.dataset.m});break;
    case 'appt':apptSheet(t.dataset.id);break;
    case 'appt-open':{const a=data.appointments.get(t.dataset.id),pid=a&&a.patientId,p=pid&&patient(pid);
      if(!p){apptSheet(t.dataset.id);break;}
      const open=(p.plan||[]).some(it=>!isDone(it));
      S.view='patients';S.patientId=pid;S.tab=open?'treat':(p.plan||[]).length?'close':'chart';S.tooth=null;S.zone=null;S.exam='teeth';S.dentition='adult';render();$('.main').scrollTop=0;break;}
    case 'status':{const id=t.dataset.id,a=data.appointments.get(id);if(a)put('appointments',id,Object.assign({},a,{status:NEXT[a.status||'booked']}));break;}
    case 'week':S.view='schedule';S.mode='day';S.date=t.dataset.d;S.patientId=null;render();$('.main').scrollTop=0;break;
    case 'appt-del':{const id=t.dataset.id,old=data.appointments.get(id);closeSheet();del('appointments',id);toast('Appointment deleted',()=>put('appointments',id,old));break;}
    case 'patient-new':patientSheet(null);break;
    case 'sel-mode':S.sel=new Set();S.selAsk=false;render();break;
    case 'sel-done':S.sel=null;S.selAsk=false;render();break;
    case 'sel-toggle':{const id=t.dataset.id;if(S.sel.has(id))S.sel.delete(id);else S.sel.add(id);S.selAsk=false;render();break;}
    case 'sel-all':{S.selAsk=false;if(S.sel.size===data.patients.size)S.sel.clear();else S.sel=new Set(data.patients.keys());render();break;}
    case 'sel-del':if(S.sel&&S.sel.size){S.selAsk=true;render();}break;
    case 'sel-cancel':S.selAsk=false;render();break;
    case 'sel-confirm':{const ids=[...S.sel];S.sel=null;S.selAsk=false;deletePatients(ids,'');break;}
    case 'demo-load':demoLoad();break;
    case 'demo-del':{const ids=[...data.patients].filter(([,p])=>p.example).map(([k])=>k);deletePatients(ids,'demo');break;}
    case 'patient-edit':patientSheet(S.patientId);break;
    case 'patient-del':{const id=S.patientId,old=patient(id),ap=[...data.appointments].filter(([,a])=>a.patientId===id),lb=[...data.lab].filter(([,l])=>l.patientId===id);
      closeSheet();S.patientId=null;ap.forEach(([aid])=>del('appointments',aid));lb.forEach(([lid])=>del('lab',lid));del('patients',id);
      toast('Patient deleted',()=>{put('patients',id,old);ap.forEach(([aid,a])=>put('appointments',aid,a));lb.forEach(([lid,l])=>put('lab',lid,l));});break;}
    case 'ppage':{S.ppage=(S.ppage||0)+(+t.dataset.n);const l=$('#plist');if(l){l.innerHTML=patientRows();l.scrollTop=0;}break;}
    case 'open':if(!patient(t.dataset.id)){toast('This patient record no longer exists.');break;}S.view='patients';S.patientId=t.dataset.id;S.tab=t.dataset.tab||'chart';S.tooth=null;S.zone=null;S.exam='teeth';S.dentition='adult';render();$('.main').scrollTop=0;break;
    case 'back':S.patientId=null;S.tooth=null;render();break;
    case 'tab':{const ch=S.tab!==t.dataset.v;S.tab=t.dataset.v;render();if(ch){const m=$('.main');if(m)m.scrollTop=0;window.scrollTo(0,0);}break;}
    case 'jopen':{const k=t.dataset.v,cur=(S.jTab===S.tab&&S.jOpen!=null)?S.jOpen:S.tab;S.jOpen=cur===k?'':k;S.jTab=S.tab;render();break;}
    case 'dent':S.dentition=t.dataset.v;S.tooth=null;render();break;
    case 'exam':S.exam=t.dataset.v;S.tooth=null;S.zone=null;render();break;
    case 'zone':S.zone=S.zone===t.dataset.z?null:t.dataset.z;render();break;
    case 'fcond':{const k=t.dataset.k,z=S.zone;if(!z)break;savePatient(S.patientId,p=>{p.face=p.face||{};if(k)p.face[z]=k;else delete p.face[z];});break;}
    case 'fin-toggle':putSettings(Object.assign({},settings,{fin:!fin()}));toast(fin()?'Finance is on':'Finance is off. Nothing was deleted.');break;
    case 'pay-new':paySheet();break;
    case 'pay-del':{const id=S.patientId,old=patient(id),pid=t.dataset.id;savePatient(id,q=>{q.pay=(q.pay||[]).filter(x=>x.id!==pid);});toast('Payment deleted',()=>put('patients',id,old));break;}
    case 'set-edit':setEdit(t.dataset.k);break;
    case 'sd-cl-add':{const l=readClin();l.push({name:'',dept:'both'});$('#sheetBody').innerHTML=clinBody(l);const ins=$('#sheetBody').querySelectorAll('input[name^=cn]');if(ins.length)ins[ins.length-1].focus();break;}
    case 'sd-cl-del':{const i=+t.dataset.i,l=readClin().filter((_,x)=>x!==i);$('#sheetBody').innerHTML=clinBody(l);break;}
    case 'sd-ch-add':{const l=readChairs();l.push('Chair '+(l.length+1));$('#sheetBody').innerHTML=chairBody(l);break;}
    case 'sd-ch-del':{const i=+t.dataset.i,l=readChairs().filter((_,x)=>x!==i);$('#sheetBody').innerHTML=chairBody(l);break;}
    case 'cl-add':putSettings(Object.assign({},settings,{clinicians:(settings.clinicians||[]).concat([{name:'',dept:'both'}])}));break;
    case 'cl-del':{const i=+t.dataset.i;putSettings(Object.assign({},settings,{clinicians:(settings.clinicians||[]).filter((_,x)=>x!==i)}));break;}
    case 'aes-toggle':putSettings(Object.assign({},settings,{aes:!settings.aes}));if(settings.aes===false)S.exam='teeth';break;
    case 'tooth':S.tooth=String(S.tooth)===t.dataset.n?null:t.dataset.n;render();break;
    case 'cond':{const k=t.dataset.k,n=S.tooth;savePatient(S.patientId,p=>{p.chart=p.chart||{};const old=tstate(p,n);if(k)p.chart[n]={c:k,s:CMAP[k].surf?old.s:[]};else delete p.chart[n];});break;}
    case 'surf':{const s=t.dataset.s,n=S.tooth;savePatient(S.patientId,p=>{const st=tstate(p,n);if(!st.c)return;p.chart[n]={c:st.c,s:st.s.includes(s)?st.s.filter(x=>x!==s):st.s.concat([s])};});break;}
    case 'plan-quick':if(isAes(t.dataset.proc))togglePlan('',t.dataset.proc,S.zone||'');else togglePlan(S.tooth,t.dataset.proc,'');break;
    case 'plan-new':planSheet();break;
    case 'stage':{const i=+t.dataset.i,iid=t.dataset.id;savePatient(S.patientId,p=>{const it=(p.plan||[]).find(x=>x.id===iid);if(!it)return;const st=it.stages.length?it.stages:[''];p.history=p.history||[];
        if(i<it.done){const drop=st.slice(i);p.history=p.history.filter(h=>!(h.itemId===iid&&drop.includes(h.stage)));it.done=i;}
        else{for(let k=it.done;k<=i;k++)p.history.push({id:uid(),date:today(),itemId:iid,proc:it.proc,tooth:it.tooth,area:it.area||'',stage:st[k]});it.done=i+1;}});break;}
    case 'plan-del':{const pid=S.patientId,iid=t.dataset.id,old=clone(patient(pid).plan||[]);
      savePatient(pid,p=>{p.plan=(p.plan||[]).filter(x=>x.id!==iid);});toast('Procedure removed',()=>savePatient(pid,p=>{p.plan=old;}));break;}
    case 'recall':recallSheet();break;
    case 'next-visit':{const id=S.patientId,p=patient(id);if(!p)break;const r=p.recall&&p.recall.date&&p.recall.date>=today()?p.recall:null;
      const pend=(p.plan||[]).find(x=>!isDone(x));
      apptSheet(null,{title:'Book next visit',patientId:id,date:r?r.date:'',reason:r?(r.reason||''):pend?pend.proc:''});break;}
    case 'recall-clear':{const id=S.patientId,old=patient(id).recall;closeSheet();savePatient(id,p=>{p.recall=null;});toast('Recall cleared',()=>savePatient(id,p=>{p.recall=old;}));break;}
    case 'recall-book':{const p=patient(t.dataset.id);apptSheet(null,{patientId:t.dataset.id,reason:(p&&p.recall&&p.recall.reason)||''});break;}
    case 'lab-new':labSheet(null);break;
    case 'lab-edit':labSheet(t.dataset.id);break;
    case 'lab-recv':{const id=t.dataset.id,l=data.lab.get(id);if(l){put('lab',id,Object.assign({},l,{received:today()}));toast('Marked received',()=>put('lab',id,l));}break;}
    case 'lab-del':{const id=t.dataset.id,old=data.lab.get(id);closeSheet();del('lab',id);toast('Lab order deleted',()=>put('lab',id,old));break;}
    case 'receipt':receiptSheet(t.dataset.date);break;
    case 'pdf-plan':planPdf();break;
    case 'pdf-day':dayPdf(t.dataset.today?today():S.date);break;
    case 'logo-pick':$('#logoFile').click();break;
    case 'backup':doBackup();break;
    case 'csv':doCsv();break;
    case 'restore-pick':$('#restoreFile').click();break;
    case 'logo-del':{const old=brand;putBrand({logo:'',w:0,h:0});toast('Logo removed',()=>putBrand(old));break;}
    case 'chair-add':putSettings(Object.assign({},settings,{chairs:settings.chairs.concat(['Chair '+(settings.chairs.length+1)])}));break;
    case 'chair-del':{const i=+t.dataset.i,old=settings;putSettings(Object.assign({},settings,{chairs:settings.chairs.filter((_,x)=>x!==i)}));toast('Chair removed',()=>putSettings(old));break;}
    case 'sheet-close':closeSheet();break;
    case 'dp-open':dpOpen(t);break;
    case 'dp-nav':if(DP){DP.month=addMonths(DP.month,+t.dataset.n);dpDraw.keep=1;dpDraw();dpDraw.keep=0;}break;
    case 'dp-pick':dpSet(t.dataset.d);break;
    case 'dp-quick':{const b=$('#'+t.dataset.btn),inp=b&&$('#'+b.dataset.for);if(inp){dpClose();dateShow(b,inp,t.dataset.d);}break;}
    case 'undo':if(undoFn){const f=undoFn;undoFn=null;$('#toast').classList.remove('open');f();}break;
  }
}
let suppress=false;
/* Do not allow optimistic edits while database is loading/disconnected. */
const unsafeActions = new Set(['fin-toggle','pay-new','pay-del','cl-add','cl-del','next-visit','fcond','aes-toggle','sel-confirm','demo-load','demo-del','patient-new','patient-edit','patient-del','appt-new','book-slot','appt','check','status',
 'appt-del','cond','surf','plan-quick','plan-new','stage','plan-del','recall','recall-clear',
 'lab-new','lab-edit','lab-recv','lab-del','logo-pick','logo-del','chair-add','chair-del','restore-pick']);
document.addEventListener('click',e=>{
  if(S.status==='ready')return;
  const t=e.target.closest('[data-act]');
  if(e.target.closest('.col') || (t&&unsafeActions.has(t.dataset.act))){
    e.preventDefault();e.stopImmediatePropagation();toast('Database not ready. Editing is paused.');
  }
},true);
document.addEventListener('submit',e=>{
  if(S.status==='ready')return;
  if(e.target.id==='sheetForm'){
    e.preventDefault();e.stopImmediatePropagation();toast('Database not ready. Changes cannot be saved.');
  }
},true);
document.addEventListener('click',e=>{
  if(suppress)return;
  if(DP&&!e.target.closest('.dpin')&&!e.target.closest('.dbtn'))dpClose();
  const t=e.target.closest('[data-act]');if(t){act(t.dataset.act,t);return;}
  const col=e.target.closest('.col');
  if(col){const r=col.getBoundingClientRect();let m=settings.dayStart*60+Math.floor((e.clientY-r.top)/HH*4)*15;m=Math.max(Math.min(m,settings.dayEnd*60-30),settings.dayStart*60);
    const date=col.dataset.date||S.date;let chair=0;
    if(col.dataset.chair!=='')chair=+col.dataset.chair;else{for(let i=0;i<settings.chairs.length;i++){if(!conflict(date,i,m,30)){chair=i;break;}}}
    apptSheet(null,{date:date,chair:chair,start:m});}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){S.query=e.target.value;S.ppage=0;const l=$('#plist');if(l)l.innerHTML=patientRows();}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='restoreFile'){readRestore(t.files&&t.files[0]);t.value='';}
  else if(t.id==='bdate'){if(t.value){S.date=t.value;render();}}
  else if(t.id==='bchair'){S.chairF=t.value;render();}
  else if(t.id==='logoFile'){loadLogo(t.files&&t.files[0]);t.value='';}
  else if(t.id==='ap-patient'){const b=$('#ap-newpt');if(b)b.hidden=t.value!=='__new';}
  else if(t.dataset&&t.dataset.clinic){const c=Object.assign({},settings.clinic||{});c[t.dataset.clinic]=t.value.trim();t.blur();putSettings(Object.assign({},settings,{clinic:c}));}
  else if(t.dataset&&t.dataset.chairI!==undefined){const i=+t.dataset.chairI,v=t.value.trim()||('Chair '+(i+1));t.blur();putSettings(Object.assign({},settings,{chairs:settings.chairs.map((c,x)=>x===i?v:c)}));}
  else if(t.dataset&&t.dataset.fee){const v=Math.max(0,Math.round(parseFloat(String(t.value).replace(/,/g,''))||0)),iid=t.dataset.fee;t.blur();savePatient(S.patientId,q=>{(q.plan||[]).forEach(i=>{if(i.id===iid)i.fee=v;});});}
  else if(t.dataset&&t.dataset.price!==undefined){const v=Math.max(0,Math.round(parseFloat(String(t.value).replace(/,/g,''))||0)),pr=Object.assign({},settings.prices||{});if(v)pr[t.dataset.price]=v;else delete pr[t.dataset.price];t.blur();putSettings(Object.assign({},settings,{prices:pr}));}
  else if(t.dataset&&t.dataset.cl!==undefined){const i=+t.dataset.cl,list=(settings.clinicians||[]).map((c,x)=>x===i?Object.assign({},c,t.dataset.f==='dept'?{dept:t.value}:{name:t.value.trim()}):c);t.blur();putSettings(Object.assign({},settings,{clinicians:list}));}
  else if(t.id==='hr-start'||t.id==='hr-end'){putSettings(Object.assign({},settings,{dayStart:+$('#hr-start').value,dayEnd:+$('#hr-end').value}));}
});
$('#sheetForm').addEventListener('submit',e=>{
  e.preventDefault();if(!sheetSubmit)return;
  const f={};new FormData(e.target).forEach((v,k)=>{f[k]=String(v);});
  const err=sheetSubmit(f);
  if(err){$('#sheetErr').textContent=err;$('#sheetErr').hidden=false;}else closeSheet();
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(DP){dpClose();return;}if(!$('#sheet').hidden)closeSheet();});
$('#sheet').addEventListener('scroll',()=>{const pop=$('#dpop');if(DP&&pop&&!pop.hidden)dpClose();});

/* Drag an appointment to another time or chair (mouse and pen). Touch opens the appointment instead. */
let drag=null;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.appt');if(!el||e.pointerType==='touch'||e.button!==0)return;drag={el:el,id:el.dataset.id,x:e.clientX,y:e.clientY,on:false,pid:e.pointerId};});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){if(Math.hypot(dx,dy)<6)return;drag.on=true;S.drag=true;try{drag.el.setPointerCapture(drag.pid);}catch(_){ }drag.el.classList.add('dragging');}
  drag.el.style.transform='translate('+dx+'px,'+dy+'px)';
});
function endDrag(e,cancel){
  if(!drag)return;const d=drag;drag=null;if(!d.on)return;
  S.drag=false;suppress=true;setTimeout(()=>{suppress=false;},0);
  const a=data.appointments.get(d.id);if(cancel||!a){render();return;}
  d.el.style.visibility='hidden';const under=document.elementFromPoint(e.clientX,e.clientY),col=under&&under.closest('.col');
  const dm=Math.round((e.clientY-d.y)/HH*4)*15;
  const start=Math.max(settings.dayStart*60,Math.min(a.start+dm,settings.dayEnd*60-a.dur)),chair=col&&col.dataset.chair!==''?+col.dataset.chair:a.chair,date=col&&col.dataset.date?col.dataset.date:a.date;
  if(start===a.start&&chair===a.chair&&date===a.date){render();return;}
  if(conflict(date,chair,start,a.dur,d.id)){render();toast('That slot is taken.');return;}
  put('appointments',d.id,Object.assign({},a,{start:start,chair:chair,date:date}));
  toast('Moved to '+fmtTime(start)+(date!==a.date?', '+fmtShort(date):', '+settings.chairs[chair]),()=>put('appointments',d.id,a));
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

let rsz=null;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{FITHH=0;render();},150);});

/* ---------- fit to one screen ---------- */
const FIT_Q='(min-width:981px) and (min-height:480px)',PG={};
function overflows(el){return !el.classList.contains('lscroll')&&el.scrollHeight-el.clientHeight>1;}
function fitBoxes(){const v=$('#view'),m=$('.main');return [m,...v.querySelectorAll('.fill:not(#plist),.bt .scroll,.calwrap .sidec,.bt,.calwrap>.dcol,.pbox,.sa-side,.sa-mg,.jsteps')];}
function anyOver(){return fitBoxes().some(overflows);}
function pageLists(){
  const v=$('#view'),vk=S.view+'|'+S.patientId+'|'+S.tab+'|'+S.mode+'|'+S.date,PER=10;
  v.querySelectorAll('.pgr').forEach(e=>e.remove());
  v.querySelectorAll('.lscroll').forEach(e=>e.classList.remove('lscroll'));
  const lists=[...v.querySelectorAll('ul.rows:not(.nopage),ul.cl,ul.agl,ul.jlist,.flist,.st-close>.sec:first-child>.card')];
  lists.forEach((list,i)=>{
    const items=[...list.children];items.forEach(x=>x.hidden=false);
    const box=list.closest('.jsteps,.pbox,.fill,.scroll,.sidec,.bt')||$('.main');
    const fits=()=>!overflows(box)&&!overflows($('.main'));
    if(fits())return;
    const n=items.length,key=vk+'|'+i;
    if(n>PER){
      const pages=Math.ceil(n/PER),p=Math.min(PG[key]||0,pages-1);PG[key]=p;
      items.forEach((x,j)=>x.hidden=!(j>=p*PER&&j<(p+1)*PER));
      const pg=document.createElement(list.tagName==='UL'||list.tagName==='OL'?'li':'div');
      pg.className='pgr';pg.innerHTML='<button type="button" data-pg="'+esc(key)+'" data-d="-1" aria-label="Previous"'+(p?'':' disabled')+'>‹</button><span>'+(p*PER+1)+'–'+Math.min(n,(p+1)*PER)+' of '+n+'</span><button type="button" data-pg="'+esc(key)+'" data-d="1" aria-label="Next"'+(p<pages-1?'':' disabled')+'>›</button>';
      list.appendChild(pg);
    }
    if(box!==$('.main')&&overflows(box))box.classList.add('lscroll');
  });
}
function fitView(){
  const v=$('#view');if(!v)return;
  {const tb=$('.topbar');document.documentElement.style.setProperty('--tbh',(tb&&getComputedStyle(tb).position==='sticky'?tb.offsetHeight:0)+'px');}
  v.style.zoom='';
  if(!matchMedia(FIT_Q).matches){v.querySelectorAll('.pgr').forEach(e=>e.remove());return;}
  if(S.view==='schedule'&&S.mode!=='month'&&!fitView.busy){
    const cb=v.querySelector('.calbody'),hd=v.querySelector('.chead'),hrs=settings.dayEnd-settings.dayStart;
    if(cb&&hrs>0){const want=Math.max(22,Math.min(96,Math.floor((cb.clientHeight-(hd?hd.offsetHeight:0)-2)/hrs)));
      if(Math.abs(want-HH)>=1){FITHH=want;fitView.busy=true;try{render();}finally{fitView.busy=false;}return;}}
  }
  const fk=[S.view,S.tab,S.mode,S.exam,S.dentition,S.patientId,innerWidth,innerHeight].join('|');
  const innerScroll=()=>{if(anyOver())fitBoxes().forEach(b=>{if(b!==$('.main')&&overflows(b))b.classList.add('lscroll');});};
  if(fitView.key===fk){if(fitView.z<1)v.style.zoom=fitView.z;pageLists();innerScroll();return;}
  pageLists();
  let z=1;while(anyOver()&&z>0.92){z=Math.round((z-0.04)*100)/100;v.style.zoom=z;pageLists();}
  innerScroll();
  fitView.key=fk;fitView.z=z;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pg]');if(!b)return;e.preventDefault();e.stopPropagation();
  const k=b.dataset.pg;PG[k]=Math.max(0,(PG[k]||0)+Number(b.dataset.d));fitView();},true);

document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[role="button"][data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
init();
})();
</script>
